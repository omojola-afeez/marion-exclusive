name: Generate Prisma Migration (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: marion
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install minimal Prisma tooling
        run: |
          # Install only Prisma CLI + client to avoid installing full project deps
          npm install --no-save prisma@6.19.3 @prisma/client@6.19.3
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 1
          done

      - name: Create migration (create-only)
        env:
          DATABASE_URL: postgresql://postgres:pass@localhost:5432/marion
        run: |
          # create migration files without applying to production
          npx prisma migrate dev --name add-nextauth-and-idempotency --create-only || npx prisma migrate dev --name add-nextauth-and-idempotency

      - name: Commit and push migrations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH=${GITHUB_REF#refs/heads/}
          # If running on workflow_dispatch, default to main
          if [ -z "$BRANCH" ]; then BRANCH=main; fi
          git add prisma/migrations || true
          if git diff --staged --quiet; then
            echo "No new migrations to commit"
          else
            git commit -m "chore(prisma): add migration for schema changes"
            git push origin HEAD:$BRANCH
          fi

      - name: Cleanup Postgres
        if: always()
        run: |
          docker stop me-postgres || true
          docker rm me-postgres || true
